<!-- noprotect -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: #000; overflow: hidden; color: #ff3300; font-family: monospace; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .ui { position: absolute; top: 20px; left: 20px; pointer-events: none; background: rgba(0,0,0,0.8); padding: 12px; border: 1px solid #440000; z-index: 10; }
    </style>
</head>
<body>
    <div class="ui">
        <span id="status">STATUS: STARTING...</span>
    </div>
    <div id="fps" style="position: absolute; top: 10px; right: 10px; color: #00ff00; font-family: monospace; font-size: 16px; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 4px; z-index: 10;">FPS: 0</div>

    <canvas id="c"></canvas>
<script type="module">
    // noprotect
    const PARTICLE_COUNT = 2**20; // actual number of particles
    const GRID_RES = 1024; 
    const SUBSTEPS = 8;  
    const ELL_A = 0.85;
    const ELL_B = 0.60;
    
    // this block is only for coloring intensity
    const BASELINE_COUNT = 2**20;
    const logScaleOffset = Math.log2(PARTICLE_COUNT / BASELINE_COUNT);
    const dynamicDenominator = Math.max(1.0, 14.0 + logScaleOffset);

    async function init() {
        const status = document.getElementById('status');
        const adapter = await navigator.gpu.requestAdapter();
        const device = await adapter.requestDevice();

        const canvas = document.getElementById('c');
        const context = canvas.getContext('webgpu');
        const format = navigator.gpu.getPreferredCanvasFormat();
        
        canvas.width = window.innerWidth * window.devicePixelRatio;
        canvas.height = window.innerHeight * window.devicePixelRatio;
        context.configure({ device, format });

        const shaderSource = `
            struct P { pos: vec2f, vel: vec2f };
            @group(0) @binding(0) var<storage, read_write> particles: array<P>;
            @group(0) @binding(1) var<storage, read_write> grid: array<atomic<u32>>;

            const a2 = ${ELL_A * ELL_A};
            const b2 = ${ELL_B * ELL_B};
            
            const gravity = -0.5;
            const dt = 0.0015;

            @compute @workgroup_size(256)
            fn cUpdate(@builtin(global_invocation_id) id: vec3u) {
                let i = id.x;
                if (i >= ${PARTICLE_COUNT}u) { return; }
                var p = particles[i];
                var seed = i + u32(p.pos.x * 1000.0) + u32(p.pos.y * 1000.0);
                // default is mag=2, grav=-0.5; but mag=5 looks really cool, also mag=50. imo, interesting configs are mag=20, grav=5; mag=10, grav=3; mag=30, grav=-2; mag=7, grav=8; mag=2, grav=0.5 (and dt=0.01 because it takes a bit). there are definitely more though, if you're reading this you really should have some fun messing around with it ^^
                let mag_strength: f32 = 2;
                
                for(var step = 0; step < ${SUBSTEPS}; step++) {

                    p.vel.y += gravity * dt;
                    
                    let mag_force = vec2f(p.vel.y, -p.vel.x) * mag_strength;
                    p.vel += mag_force * dt;

                    let next_pos = p.pos + p.vel * dt;

                    let e_val = (next_pos.x * next_pos.x) / a2 + (next_pos.y * next_pos.y) / b2;

                    if (e_val >= 1.0) {
                        let n = normalize(vec2f(next_pos.x / a2, next_pos.y / b2));
                        let noise = f32(seed & 127u) / 6400.0 - 0.01;
                        p.vel = reflect(p.vel, n) * (0.98 + noise);
                        p.pos = next_pos - n * (e_val - 0.998);
                        seed += 1u;
                    } else {
                        p.pos = next_pos;
                    }

                    let float_gx = (p.pos.x * 0.5 + 0.5) * f32(${GRID_RES});
                    let float_gy = (p.pos.y * 0.5 + 0.5) * f32(${GRID_RES});

                    let rx = f32(seed & 127u) / 128.0;
                    let ry = f32((seed >> 7u) & 127u) / 128.0;
                    
                    let gx = u32(float_gx + rx - 0.5) & 1023u;
                    let gy = u32(float_gy + ry - 0.5) & 1023u;
                     
                    atomicAdd(&grid[(gy << 10u) | gx], 1u);
                    
                    seed += 7u;
                }
                particles[i] = p;
            }

            @compute @workgroup_size(256)
            fn cDecay(@builtin(global_invocation_id) id: vec3u) {
                let idx = id.x;
                if (idx >= ${GRID_RES * GRID_RES}u) { return; }
                let val = atomicLoad(&grid[idx]);
                atomicStore(&grid[idx], (val * 90u) / 100u); 
            }

            fn getHeatColor(v: f32) -> vec3f {
                //  Dark -> Purple -> Red -> Orange -> Yellow -> White
                let c0 = vec3f(0.01, 0.0, 0.02);
                let c1 = vec3f(0.3, 0.0, 0.5);
                let c2 = vec3f(0.8, 0.0, 0.0);
                let c3 = vec3f(1.0, 0.4, 0.0);
                let c4 = vec3f(1.0, 0.9, 0.0);
                let c5 = vec3f(1.0, 1.0, 1.0);

                if (v < 0.2) { return mix(c0, c1, v / 0.2); }
                if (v < 0.5) { return mix(c1, c2, (v - 0.2) / 0.3); }
                if (v < 0.7) { return mix(c2, c3, (v - 0.5) / 0.2); }
                if (v < 0.9) { return mix(c3, c4, (v - 0.7) / 0.2); }
                return mix(c4, c5, (v - 0.9) / 0.1);
            }

            @vertex fn vMain(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
                let pos = array<vec2f, 4>(vec2f(-1,-1), vec2f(1,-1), vec2f(-1,1), vec2f(1,1));
                return vec4f(pos[i], 0.0, 1.0);
            }

            @fragment fn fMain(@builtin(position) pos: vec4f) -> @location(0) vec4f {
                let uv = pos.xy / vec2f(${canvas.width}.0, ${canvas.height}.0);
                let gx = u32(uv.x * ${GRID_RES}.0);
                let gy = u32((1.0 - uv.y) * ${GRID_RES}.0);

                let raw_val = atomicLoad(&grid[gy * ${GRID_RES}u + gx]);
                let val = f32(raw_val);
                let intensity = clamp(log2(val + 1.0) / ${dynamicDenominator}, 0.0, 1.0);
                
                var color = getHeatColor(intensity);

                let A = ${ELL_A};
                let B = ${ELL_B};
                let a2_val = A * A;
                let b2_val = B * B;

                let screen_size = vec2f(${canvas.width}.0, ${canvas.height}.0);
                let coords = (pos.xy / screen_size) * 2.0 - 1.0;
                
                let x = coords.x;
                let y = -coords.y; 

                let ellipse_eqn = (x * x) / a2_val + (y * y) / b2_val;
                
                let dist = abs(ellipse_eqn - 1.0);
                let delta = fwidth(ellipse_eqn);

                let edge = smoothstep(delta * 1.5, 0.0, dist);

                color = mix(color, vec3f(0.4, 0.5, 1.0), edge);

                return vec4f(color, 1.0);
            }

        `;

        const shaderModule = device.createShaderModule({ code: shaderSource });
        const pData = new Float32Array(PARTICLE_COUNT * 4);
        for(let i = 0; i < PARTICLE_COUNT; i++) {
            pData[i*4+0] = 0; 
            pData[i*4+1] = 0.5; pData[i*4+2] = (Math.random() - 0.5) * 0.5; 
            pData[i*4+3] = 0;
        }

        const pBuf = device.createBuffer({ size: pData.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
        device.queue.writeBuffer(pBuf, 0, pData);
        const gBuf = device.createBuffer({ size: GRID_RES * GRID_RES * 4, usage: GPUBufferUsage.STORAGE });

        const bgl = device.createBindGroupLayout({
            entries: [
                { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
                { binding: 1, visibility: GPUShaderStage.COMPUTE | GPUShaderStage.FRAGMENT, buffer: { type: 'storage' } }
            ]
        });

        const bg = device.createBindGroup({ layout: bgl, entries: [{ binding: 0, resource: { buffer: pBuf } }, { binding: 1, resource: { buffer: gBuf } }] });
        const pl = device.createPipelineLayout({ bindGroupLayouts: [bgl] });
        
        const cpU = device.createComputePipeline({ layout: pl, compute: { module: shaderModule, entryPoint: 'cUpdate' } });
        const cpD = device.createComputePipeline({ layout: pl, compute: { module: shaderModule, entryPoint: 'cDecay' } });
        const rpR = device.createRenderPipeline({
            layout: pl, vertex: { module: shaderModule, entryPoint: 'vMain' },
            fragment: { module: shaderModule, entryPoint: 'fMain', targets: [{ format }] },
            primitive: { topology: 'triangle-strip' }
        });

        status.innerText = "STATUS: RUNNING";
        const fpsDisplay = document.getElementById('fps');

        let lastTime = performance.now();
        let frameCount = 0;
        
        function frame() {
            
            const encoder = device.createCommandEncoder();

            const pass1 = encoder.beginComputePass();
            pass1.setPipeline(cpD); 
            pass1.setBindGroup(0, bg);
            pass1.dispatchWorkgroups(Math.ceil((GRID_RES * GRID_RES) / 256));
            pass1.end();

            const pass2 = encoder.beginComputePass();
            pass2.setPipeline(cpU);
            pass2.setBindGroup(0, bg);

            const CHUNK_SIZE = 1048576;
            for (let offset = 0; offset < PARTICLE_COUNT; offset += CHUNK_SIZE) {
                const currentChunk = Math.min(CHUNK_SIZE, PARTICLE_COUNT - offset);
                pass2.dispatchWorkgroups(Math.ceil(currentChunk / 256)); 
            }
            pass2.end();

            const pass3 = encoder.beginRenderPass({
                colorAttachments: [{ 
                    view: context.getCurrentTexture().createView(), 
                    clearValue: {r:0,g:0,b:0,a:1}, 
                    loadOp: 'clear', 
                    storeOp: 'store' 
                }]
            });
            pass3.setPipeline(rpR); 
            pass3.setBindGroup(0, bg);
            pass3.draw(4);
            pass3.end();

            device.queue.submit([encoder.finish()]);
            requestAnimationFrame(frame);
            const now = performance.now();
            frameCount++;
            
            if (now >= lastTime + 1000) {
                fpsDisplay.innerText = `FPS: ${frameCount}`;
                frameCount = 0;
                lastTime = now;
            }
        }

        requestAnimationFrame(frame);
    }
    init();
</script>
</body>
</html>
